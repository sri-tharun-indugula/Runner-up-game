<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1020" />
    <title>Tharun Infinity Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #1b1238 0%, #0b1020 55%, #070a14 100%);
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        color: #f8fafc;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-container.has-dom-overlay {
        isolation: isolate;
      }

      #game-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      #dom-overlay {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(7, 10, 20, 0.62);
        backdrop-filter: blur(2px);
      }

      #dom-overlay.is-active {
        display: flex;
        pointer-events: auto;
      }

      .dom-overlay-panel.is-wide {
        width: min(720px, calc(100% - 24px));
      }

      .dom-overlay-panel {
        width: min(420px, calc(100% - 32px));
        pointer-events: auto;
      }

      .dom-overlay-panel.is-entering .dom-menu {
        animation: dom-panel-enter 220ms ease-out;
      }

      @keyframes dom-panel-enter {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .dom-menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px 24px 24px;
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(36, 18, 77, 0.96), rgba(11, 16, 32, 0.98));
        border: 2px solid rgba(45, 226, 230, 0.45);
        box-shadow:
          0 0 0 1px rgba(255, 46, 151, 0.2),
          0 18px 40px rgba(0, 0, 0, 0.5),
          0 0 28px rgba(45, 226, 230, 0.15);
        text-align: center;
        color: #f8fafc;
      }

      .dom-kicker {
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2de2e6;
      }

      .dom-title {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(26px, 5vw, 40px);
        line-height: 1.1;
        font-weight: 800;
        text-transform: uppercase;
        background: linear-gradient(90deg, #2de2e6, #ff2e97 55%, #ffe66d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .dom-title-sm {
        font-size: clamp(22px, 4.5vw, 32px);
      }

      .dom-best,
      .dom-score,
      .dom-reason,
      .dom-stats {
        color: #d7deea;
        font-size: 16px;
        font-weight: 600;
      }

      .dom-best strong,
      .dom-score strong {
        color: #ffe66d;
        font-family: 'Orbitron', sans-serif;
      }

      .dom-reason {
        color: #ff2e97;
        font-weight: 700;
      }

      .dom-btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 6px;
      }

      .dom-btn {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
        min-height: 48px;
      }

      .dom-btn:hover {
        transform: scale(1.03);
        filter: brightness(1.08);
      }

      .dom-btn:active {
        transform: scale(0.97);
      }

      .dom-btn-primary {
        background: linear-gradient(90deg, #2de2e6, #7cff6b);
        color: #0b1020;
        box-shadow: 0 0 18px rgba(45, 226, 230, 0.35);
      }

      .dom-btn-secondary {
        background: rgba(58, 28, 110, 0.9);
        color: #f8fafc;
        border: 1px solid rgba(255, 46, 151, 0.45);
      }

      .dom-hint {
        margin-top: 4px;
        font-size: 13px;
        color: #9aa4bd;
      }

      .dom-settings {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 4px 0 8px;
      }

      .dom-setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 15px;
        color: #d7deea;
      }

      .dom-btn-compact {
        width: auto;
        padding: 8px 14px;
        font-size: 12px;
        min-height: 40px;
      }

      .dom-settings-volume {
        width: min(160px, 45vw);
        accent-color: #2de2e6;
      }

      .dom-guide {
        max-height: min(92vh, 900px);
        overflow: auto;
      }

      .guide-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        text-align: left;
      }

      .guide-section {
        padding: 12px;
        border-radius: 12px;
        background: rgba(15, 12, 36, 0.72);
        border: 1px solid rgba(45, 226, 230, 0.2);
      }

      .guide-section h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #2de2e6;
        margin-bottom: 8px;
      }

      .guide-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .guide-list li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .guide-list strong {
        display: block;
        color: #fff;
        font-size: 14px;
      }

      .guide-list span {
        display: block;
        color: #9aa4bd;
        font-size: 12px;
        line-height: 1.35;
      }

      .guide-controls li {
        justify-content: space-between;
        gap: 12px;
      }

      .guide-controls strong {
        min-width: 96px;
        color: #ffe66d;
      }

      .guide-swatches i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        margin-top: 3px;
        flex: 0 0 auto;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      }

      .guide-icons li {
        align-items: center;
      }

      .guide-icon {
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(11, 16, 32, 0.85);
        border: 1px solid rgba(45, 226, 230, 0.28);
        box-shadow: inset 0 0 12px rgba(45, 226, 230, 0.08);
        overflow: hidden;
        image-rendering: pixelated;
      }

      .guide-icon-lg {
        width: 72px;
        height: 72px;
        border-radius: 14px;
      }

      .guide-runner {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
      }

      .guide-runner h2 {
        margin-bottom: 4px;
      }

      .guide-runner p {
        color: #9aa4bd;
        font-size: 13px;
        line-height: 1.35;
        margin: 0;
      }

      .guide-icon-still {
        display: block;
        object-fit: contain;
      }

      .guide-icon-sheet {
        display: block;
        width: var(--guide-fw, 36px);
        height: var(--guide-fh, 36px);
        background-repeat: no-repeat;
        background-size: var(--guide-sheet) var(--guide-fh);
        animation: guide-sheet-spin 0.7s steps(var(--guide-frames, 6)) infinite;
      }

      .guide-icon-fallback {
        background: #5b6478;
      }

      .guide-motion-bob {
        animation: guide-bob 1.1s ease-in-out infinite;
      }

      .guide-motion-pulse {
        animation: guide-pulse 1.2s ease-in-out infinite;
      }

      .guide-motion-blink {
        animation: guide-blink 0.9s ease-in-out infinite;
      }

      @keyframes guide-sheet-spin {
        from { background-position: 0 0; }
        to { background-position: calc(var(--guide-sheet) * -1) 0; }
      }

      @keyframes guide-bob {
        0%, 100% { transform: translateY(2px); }
        50% { transform: translateY(-3px); }
      }

      @keyframes guide-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      @keyframes guide-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }

      .guide-tips {
        width: 100%;
        text-align: left;
      }

      .guide-tips-list {
        list-style: disc;
        padding-left: 18px;
        color: #cbd5e1;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      @media (max-width: 700px) {
        .guide-grid {
          grid-template-columns: 1fr;
        }
      }

      .dom-unlock-list {
        width: 100%;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 4px 0 8px;
        text-align: left;
        max-height: min(320px, 46vh);
        overflow: auto;
      }

      .dom-unlock-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(15, 12, 36, 0.75);
        border: 1px solid rgba(45, 226, 230, 0.22);
      }

      .dom-unlock-row strong {
        display: block;
        color: #fff;
      }

      .dom-unlock-row span {
        display: block;
        font-size: 12px;
        color: #9aa4bd;
      }

      .dom-unlock-row.is-locked {
        opacity: 0.55;
      }

      .dom-score-list {
        width: 100%;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 4px 0 8px;
        text-align: left;
      }

      .dom-score-list li {
        display: grid;
        grid-template-columns: 36px 1fr;
        grid-template-rows: auto auto;
        gap: 2px 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(15, 12, 36, 0.75);
        border: 1px solid rgba(45, 226, 230, 0.22);
      }

      .dom-score-rank {
        grid-row: span 2;
        align-self: center;
        color: #2de2e6;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
      }

      .dom-score-value {
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
      }

      .dom-score-meta {
        font-size: 12px;
        color: #9aa4bd;
      }

      #hud-overlay {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        z-index: 15;
        display: none;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        max-width: min(240px, calc(100% - 140px));
      }

      #hud-overlay.is-visible {
        display: flex;
      }

      .hud-card {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(11, 16, 32, 0.82);
        border: 1px solid rgba(45, 226, 230, 0.35);
        color: #f8fafc;
        box-shadow: 0 0 18px rgba(45, 226, 230, 0.12);
        backdrop-filter: blur(4px);
        font-family: 'Rajdhani', sans-serif;
      }

      .hud-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 15px;
        margin-bottom: 6px;
        font-weight: 600;
      }

      .hud-row span {
        color: #9aa4bd;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 12px;
      }

      .hud-row strong {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 13px;
        color: #ffe66d;
      }

      .hud-row-muted {
        font-size: 12px;
        opacity: 0.9;
      }

      .hud-meta {
        min-height: 14px;
        margin-top: 4px;
        font-size: 12px;
        color: #2de2e6;
        font-family: 'Orbitron', sans-serif;
      }

      .hud-powers {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .hud-power {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: #e2e8f0;
      }

      .hud-power strong {
        color: #ff2e97;
        font-variant-numeric: tabular-nums;
        font-family: 'Orbitron', sans-serif;
      }

      .hud-hint {
        font-size: 11px;
        color: rgba(154, 164, 189, 0.9);
        padding-left: 4px;
      }

      #audio-bar {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(11, 16, 32, 0.88);
        border: 1px solid rgba(45, 226, 230, 0.35);
        pointer-events: auto;
      }

      .audio-mute-btn {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: linear-gradient(90deg, #2de2e6, #7cff6b);
        color: #0b1020;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        min-height: 36px;
      }

      .audio-mute-btn.is-muted {
        background: #5b6478;
        color: #f8fafc;
      }

      .audio-volume {
        width: 90px;
        accent-color: #2de2e6;
        cursor: pointer;
      }

      #fps-overlay {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        display: none;
        gap: 10px;
        align-items: center;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(11, 16, 32, 0.88);
        border: 1px solid rgba(45, 226, 230, 0.4);
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        color: #2de2e6;
        pointer-events: none;
      }

      #fps-overlay.is-visible {
        display: flex;
      }

      #fps-overlay [data-fps="quality"] {
        color: #ffe66d;
      }

      #touch-controls {
        position: absolute;
        inset: 0;
        z-index: 18;
        pointer-events: none;
        display: none;
      }

      #touch-controls.is-visible {
        display: block;
      }

      .touch-btn {
        pointer-events: auto;
        position: absolute;
        border: 2px solid rgba(45, 226, 230, 0.7);
        background: rgba(11, 16, 32, 0.72);
        color: #2de2e6;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        box-shadow: 0 0 16px rgba(45, 226, 230, 0.25);
        user-select: none;
        touch-action: none;
      }

      .touch-jump {
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 86px;
        height: 86px;
        border-radius: 50%;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .touch-pause {
        right: max(18px, env(safe-area-inset-right));
        bottom: calc(18px + 96px + env(safe-area-inset-bottom, 0px));
        width: 48px;
        height: 48px;
        border-radius: 14px;
        font-size: 14px;
        color: #ff2e97;
        border-color: rgba(255, 46, 151, 0.7);
      }

      .touch-btn.is-pressed {
        transform: scale(0.94);
        background: rgba(45, 226, 230, 0.28);
      }

      #orientation-guard {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(7, 10, 20, 0.94);
        text-align: center;
        padding: 24px;
      }

      #orientation-guard.is-visible {
        display: flex;
      }

      .orientation-card {
        max-width: 320px;
      }

      .orientation-icon {
        font-size: 42px;
        color: #2de2e6;
        margin-bottom: 12px;
      }

      .orientation-card h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 22px;
        margin-bottom: 8px;
      }

      .orientation-card p {
        color: #9aa4bd;
        font-size: 15px;
      }

      @media (max-width: 900px) {
        .dom-overlay-panel {
          width: min(100%, calc(100% - 20px));
        }

        .dom-menu {
          padding: 22px 16px 18px;
          gap: 12px;
        }

        #audio-bar {
          top: auto;
          bottom: max(12px, env(safe-area-inset-bottom));
          right: max(12px, env(safe-area-inset-right));
        }

        .audio-volume {
          width: 72px;
        }

        #hud-overlay {
          max-width: min(190px, calc(100% - 24px));
        }

        .hud-hint {
          display: none;
        }
      }

      @media (pointer: fine) {
        #touch-controls.is-visible {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
